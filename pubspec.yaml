name: pharmacy_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # UI & Navigation
  cupertino_icons: ^1.0.2
  google_fonts: ^4.0.3
  provider: ^6.0.0
  flutter_svg: ^1.1.6
  
  # Navigation & Routing
  go_router: ^8.0.0
  auto_route: ^5.0.0
  
  # State Management
  riverpod: ^2.3.6
  flutter_riverpod: ^2.3.6
  
  # UI Components
  flutter_screenutil: ^5.7.0  
  shimmer: ^3.0.0
  
  # Form & Validation
  flutter_form_builder: ^8.0.0
  image_picker: ^0.8.7+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/